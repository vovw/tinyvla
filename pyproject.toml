[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simvla"
version = "0.1.0"
description = "SimVLA training and evaluation stack"
readme = "readme.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "accelerate>=0.33.0",
  "av>=12.0.0",
  "einops>=0.8.0",
  "fastapi>=0.111.0",
  "h5py>=3.11.0",
  "imageio>=2.35.0",
  "json-numpy>=2.1.0",
  "mediapy>=1.2.0",
  "mmengine>=0.10.0",
  "msgpack-numpy>=0.4.8",
  "num2words>=0.5.14",
  "peft>=0.12.0",
  "pyarrow>=16.0.0",
  "requests>=2.32.0",
  "safetensors>=0.4.3",
  "scipy>=1.11.0",
  "tensorboard>=2.16.0",
  "timm>=1.0.0",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "tqdm>=4.66.0",
  "transformers>=4.57.0",
  "uvicorn>=0.30.0",
  "wandb>=0.17.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
flash-attn = ["flash-attn==2.5.6"]
tensorflow = ["tensorflow>=2.16.0", "tensorflow-datasets>=4.9.0"]
libero-client = ["openpi-client>=0.1.0"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[tool.uv.extra-build-dependencies]
flash-attn = ["packaging", "wheel", "setuptools>=70.1", "torch"]
